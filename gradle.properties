# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:real_world_example_parallel_execution
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are part of the Android SDK, and which are 
# installed with your app's APK. https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables K2 compiler for better performance
# kotlin.experimental.tryK2=true
android.disallowKotlinSourceSets=false
android.builtInKotlin=false
android.newDsl=false
ksp.useKSP2=true
